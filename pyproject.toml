[project]
name = "figuretrail"
version = "0.1.0"
description = "Numerical questions answered with traceable report evidence."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
